<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Explorer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    input, button {
      padding: 12px;
      margin: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background: blue;
      color: white;
      cursor: pointer;
    }

    .book {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }

    #status {
      margin: 15px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>📚 Book Explorer</h1>

    <input id="search" placeholder="Enter book name">
    <button onclick="searchBooks()">Search</button>

    <div id="status"></div>
    <div id="books"></div>
  </div>

  <script>
    async function searchBooks() {
      const query = document.getElementById("search").value.trim();
      const status = document.getElementById("status");
      const books = document.getElementById("books");

      books.innerHTML = "";

      if (!query) {
        status.innerHTML = "Please enter a book name!";
        return;
      }

      status.innerHTML = "⏳ Loading...";
      
      try {
        const response = await fetch(
          `https://openlibrary.org/search.json?title=${encodeURIComponent(query)}`
        );

        if (!response.ok) {
          throw new Error("API Error");
        }

        const data = await response.json();
        status.innerHTML = "";

        if (!data.docs || data.docs.length === 0) {
          status.innerHTML = "📭 No books found!";
          return;
        }

        data.docs.slice(0, 10).forEach(book => {
          books.innerHTML += `
            <div class="book">
              <h3>${book.title || "Unknown Title"}</h3>
              <p>Author: ${book.author_name?.join(", ") || "Unknown"}</p>
              <p>Year: ${book.first_publish_year || "Unknown"}</p>
            </div>
          `;
        });

      } catch (error) {
        status.innerHTML = `
          ❌ Something went wrong!
          <button onclick="searchBooks()">Retry</button>
        `;
      }
    }
  </script>

</body>
</html>
